name: Build
permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  pull_request:
    branches:
      - main

jobs:
  build:
    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js 24
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Audit
      run: npm audit --audit-level high --omit dev

    - name: Lint
      run: npm run lint

    - name: Update version
      if: github.ref_type == 'tag'
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        npm version "$VERSION" --no-git-tag-version

    - name: Build
      run: |
        npm run build

    - name: Publish
      if: github.ref_type == 'tag'
      run: |
        npm publish --access public --provenance

    - name: Publish on github mcp registry
      if: github.ref_type == 'tag'
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        brew install mcp-publisher
        mcp-publisher login github-oidc
        # patch version
        sed -i "s/{{VERSION}}/$VERSION/g" server.json
        mcp-publisher publish
        mcp-publisher logout

  e2e_test:
    runs-on: self-hosted
    needs: build
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Build
      run: npm run build

    - name: Configure mobile-mcp MCP server
      run: |
        claude mcp remove mobile-mcp --scope local || true
        claude mcp add mobile-mcp --scope local -- node "$(pwd)/lib/index.js"

    - name: Run Android emulator test prompt
      run: claude --dangerously-skip-permissions -p < test/prompt-android-emulator.md

    - name: Run iOS simulator test prompt
      run: claude --dangerously-skip-permissions -p < test/prompt-ios-simulator.md
