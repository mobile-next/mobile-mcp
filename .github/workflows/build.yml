name: Build
permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  pull_request:
    branches:
      - main

jobs:
  build:
    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js 24
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Audit
      run: npm audit --audit-level high --omit dev

    - name: Lint
      run: npm run lint

    - name: Update version
      if: github.ref_type == 'tag'
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        npm version "$VERSION" --no-git-tag-version

    - name: Build
      run: |
        npm run build

    - name: Publish
      if: github.ref_type == 'tag'
      run: |
        npm publish --access public --provenance

    - name: Publish on github mcp registry
      if: github.ref_type == 'tag'
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        brew install mcp-publisher
        mcp-publisher login github-oidc
        # patch version
        sed -i "s/{{VERSION}}/$VERSION/g" server.json
        mcp-publisher publish
        mcp-publisher logout

  publish_mcpb:
    # macos runner (arm64) so sharp bundles darwin-arm64 native libs;
    # the bundle targets macOS Apple Silicon to fit Smithery's 25MB cap
    runs-on: macos-latest
    needs: build
    if: github.ref_type == 'tag'
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Use Node.js 24
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    - name: Build
      run: |
        npm ci --ignore-scripts
        npm run build

    - name: Pack mcpb bundle (darwin-arm64)
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        mkdir -p /tmp/mcpb-stage
        cp -r lib package.json package-lock.json manifest.json icon.png /tmp/mcpb-stage/
        cd /tmp/mcpb-stage
        node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.json'));m.version=process.env.VERSION;fs.writeFileSync('manifest.json',JSON.stringify(m,null,'\t'))"
        npm version "$VERSION" --no-git-tag-version
        npm ci --omit=dev --ignore-scripts
        # trim to darwin-arm64: other platforms' mobilecli binaries and the
        # sharp wasm fallback push the bundle past Smithery's 25MB cap
        rm -f node_modules/mobilecli/bin/*windows* node_modules/mobilecli/bin/*linux* node_modules/mobilecli/bin/mobilecli-darwin-amd64
        rm -rf node_modules/@img/sharp-wasm32
        npx -y @anthropic-ai/mcpb pack . /tmp/mobile-mcp.mcpb
        ls -lh /tmp/mobile-mcp.mcpb

    - name: Publish to Smithery
      env:
        SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
      run: |
        npx -y @smithery/cli mcp publish /tmp/mobile-mcp.mcpb -n mobile-next/mobile-mcp

  e2e_test:
    runs-on: self-hosted
    needs: build
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Build
      run: npm run build

    - name: Configure mobile-mcp MCP server
      run: |
        claude mcp remove mobile-mcp --scope local || true
        claude mcp add mobile-mcp --scope local -- node "$(pwd)/lib/index.js"

    - name: Run Android emulator test prompt
      run: |
        set -o pipefail
        claude --dangerously-skip-permissions -p < test/prompt-android-emulator.md | node test/validate-response.js

    - name: Run iOS simulator test prompt
      run: |
        set -o pipefail
        claude --dangerously-skip-permissions -p < test/prompt-ios-simulator.md | node test/validate-response.js
