name: Build
permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"

jobs:
  build:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js 24
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Lint
      run: npm run lint

    - name: Build
      run: |
        npm run build

  unittest:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Use Node.js 24
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Test
      run: npm run test

  publish_npm:
    runs-on: ubuntu-latest
    needs: [build, unittest, e2e_test]
    if: github.ref_type == 'tag'
    permissions:
      id-token: write
      contents: write

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js 24
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Update version
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        npm version "$VERSION" --no-git-tag-version

    - name: Build
      run: |
        npm run build

    - name: Publish
      run: |
        npm publish --access public --provenance

    - name: Wait for package to be available on npm
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        # npm takes a while to serve a freshly published version; give up after 10 minutes
        for attempt in $(seq 1 120); do
          if npm view "@mobilenext/mobile-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "@mobilenext/mobile-mcp@$VERSION is available on npm"
            exit 0
          fi
          echo "Waiting for @mobilenext/mobile-mcp@$VERSION on npm (attempt $attempt/120)"
          sleep 5
        done
        echo "@mobilenext/mobile-mcp@$VERSION did not appear on npm in time"
        exit 1

    - name: Publish on github mcp registry
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        brew install mcp-publisher
        mcp-publisher login github-oidc
        # patch version
        sed -i "s/{{VERSION}}/$VERSION/g" server.json
        mcp-publisher publish
        mcp-publisher logout

    - name: Create or update GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        sed -n "/^## \[$VERSION\]/,/^## \[/{ /^## \[$VERSION\]/p; /^## \[/!p; }" CHANGELOG.md > release-notes.md
        if [ ! -s release-notes.md ]; then
          echo "::error::CHANGELOG.md has no section for $VERSION"
          exit 1
        fi
        if gh release view "$GITHUB_REF_NAME" &>/dev/null; then
          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
        else
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        fi

  publish_mcpb:
    # one bundle per Claude Desktop platform, built and smoke-tested on that platform,
    # then attached to the GitHub release that publish_npm creates
    needs: [publish_npm]
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            runner: macos-latest
          - platform: win32
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      BUNDLE: mobile-mcp-${{ matrix.platform }}.mcpb

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Use Node.js 24
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    - name: Build
      run: |
        npm ci --ignore-scripts
        npm run build

    - name: Pack mcpb bundle
      run: scripts/pack-mcpb.sh "$GITHUB_REF_NAME" "${{ matrix.platform }}" "$BUNDLE"

    - name: Smoke-test the bundle on this platform
      run: scripts/smoke-test-mcpb.sh "$BUNDLE"

    - name: Attach mcpb bundle to GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$GITHUB_REF_NAME" "$BUNDLE" --clobber --repo "$GITHUB_REPOSITORY"

  e2e_test:
    runs-on: self-hosted
    needs: build
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Build
      run: npm run build

    - name: Configure mobile-mcp MCP server
      run: |
        claude mcp remove mobile-mcp --scope local || true
        claude mcp add mobile-mcp --scope local -- node "$(pwd)/lib/index.js"

    - name: Run Android emulator test prompt
      run: |
        set -o pipefail
        claude --dangerously-skip-permissions -p < test/prompt-android-emulator.md | node test/validate-response.js

    - name: Run iOS simulator test prompt
      run: |
        set -o pipefail
        claude --dangerously-skip-permissions -p < test/prompt-ios-simulator.md | node test/validate-response.js
